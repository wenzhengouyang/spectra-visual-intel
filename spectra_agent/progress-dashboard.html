<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPECTRA 今日进展</title>
  <style>
    /* Hallmark · macrostructure: Workbench status strip · theme: project tokens · tone: calm newsroom · anchor hue: steel blue */
    /* Hallmark · pre-emit critique: P5 H5 E5 S5 R5 V5 · slop: pass · honest: pass · chrome: pass · tokens: pass · responsive: pass · mobile: pass */
    :root {
      --paper: oklch(13.5% 0.018 255); --paper-raised: oklch(18.8% 0.021 254);
      --ink: oklch(94% 0.012 250); --muted: oklch(67% 0.023 250);
      --rule: oklch(28% 0.025 253); --accent: oklch(70% 0.095 225);
      --accent-soft: oklch(24% 0.043 226); --green: oklch(70% 0.08 157);
      --orange: oklch(72% 0.09 60); --danger: oklch(67% 0.16 27);
      --display: "Avenir Next", "PingFang SC", sans-serif;
      --body: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      --mono: "SFMono-Regular", Consolas, monospace;
      --space-1: .5rem; --space-2: .75rem; --space-3: 1rem; --space-4: 1.5rem;
      --space-5: 2rem; --space-6: 3rem; --radius: .625rem;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; overflow-x: clip; background: var(--paper); color: var(--ink); }
    body { font-family: var(--body); }
    main { width: min(72rem, 100%); margin: 0 auto; padding: clamp(1.25rem, 5vw, 4rem); }
    header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: var(--space-4); padding-bottom: var(--space-5); border-bottom: 1px solid var(--rule); }
    .brand { font: 600 .75rem/1 var(--mono); letter-spacing: .15em; color: var(--accent); }
    h1 { margin: var(--space-2) 0 0; font: 600 clamp(2rem, 7vw, 4.75rem)/1.02 var(--display); letter-spacing: -.04em; overflow-wrap: anywhere; min-width: 0; }
    .meta { text-align: left; color: var(--muted); font-size: .875rem; line-height: 1.7; }
    .live { display: inline-flex; align-items: center; gap: var(--space-1); color: var(--ink); }
    .live::before { content: ""; width: .5rem; height: .5rem; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 .25rem color-mix(in oklch, var(--green), transparent 82%); }
    .summary { display: grid; gap: var(--space-4); padding: var(--space-5) 0; border-bottom: 1px solid var(--rule); }
    .status { font: 600 clamp(1.5rem, 4vw, 2.5rem)/1.1 var(--display); overflow-wrap: anywhere; min-width: 0; }
    .status-note { margin: .6rem 0 0; color: var(--muted); line-height: 1.6; }
    .measure { align-self: end; }
    .measure strong { display: block; font: 500 clamp(2rem, 8vw, 4rem)/1 var(--display); }
    .measure span { color: var(--muted); font-size: .85rem; }
    .bar { height: .35rem; margin-top: var(--space-2); background: var(--rule); overflow: hidden; }
    .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .35s ease; }
    .stage-link { display: inline-block; margin-top: .75rem; color: var(--accent); font-size: .8rem; text-decoration: none; border-bottom: 1px solid var(--accent); white-space: nowrap; }
    .stage-link:hover { color: var(--ink); border-color: var(--ink); }
    .stage-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .action { margin-top: var(--space-5); padding: var(--space-4); border: 1px solid var(--orange); background: color-mix(in oklch, var(--orange), transparent 92%); }
    .action[hidden] { display: none; }
    .action strong { display: block; font-size: 1.05rem; }
    .action p { margin: .45rem 0 0; color: var(--muted); line-height: 1.55; }
    ol { list-style: none; margin: 0; padding: var(--space-5) 0 0; }
    li { display: grid; grid-template-columns: 2.25rem minmax(0, 1fr); gap: var(--space-3); padding: var(--space-4) 0; border-bottom: 1px solid var(--rule); color: var(--muted); }
    .mark { display: grid; place-items: center; width: 1.65rem; height: 1.65rem; border: 1px solid var(--rule); border-radius: 50%; font: .72rem/1 var(--mono); }
    li.done .mark { border-color: var(--green); color: var(--green); }
    li.current { color: var(--ink); }
    li.current .mark { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
    .step-name { font-weight: 600; }
    .step-detail { margin-top: .3rem; font-size: .875rem; color: var(--muted); }
    footer { padding-top: var(--space-4); color: var(--muted); font-size: .78rem; line-height: 1.6; }
    .error { color: var(--danger); }
    body.widget { border-radius: 1.75rem; background: var(--paper-raised); }
    body.widget main { width: 334px; height: 356px; overflow: hidden; padding: 1.25rem; }
    body.widget header { align-items: center; gap: var(--space-2); padding-bottom: .8rem; }
    body.widget .brand { font-size: .625rem; }
    body.widget h1 { margin-top: .3rem; font-size: 1.6rem; }
    body.widget .meta { font-size: .68rem; line-height: 1.45; text-align: right; }
    body.widget .summary { grid-template-columns: minmax(0, 1fr) 5rem; gap: var(--space-2); padding: .8rem 0; }
    body.widget .status { font-size: 1.2rem; }
    body.widget .status-note { margin-top: .35rem; font-size: .68rem; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    body.widget .measure { text-align: right; }
    body.widget .measure strong { font-size: 1.55rem; }
    body.widget .measure span { font-size: .62rem; white-space: nowrap; }
    body.widget .bar { margin-top: .35rem; }
    body.widget .action { margin-top: .75rem; padding: .65rem .75rem; }
    body.widget .action strong { font-size: .78rem; }
    body.widget .action p { margin-top: .2rem; font-size: .65rem; line-height: 1.35; }
    body.widget .stage-link { margin-top: .35rem; font-size: .66rem; }
    body.widget ol { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 1rem; padding-top: .7rem; }
    body.widget li { grid-template-columns: 1.45rem minmax(0, 1fr); gap: .45rem; padding: .5rem 0; font-size: .72rem; }
    body.widget .mark { width: 1.15rem; height: 1.15rem; font-size: .55rem; }
    body.widget .step-detail, body.widget footer { display: none; }
    @media (min-width: 40rem) {
      .summary { grid-template-columns: minmax(0, 1fr) 13rem; }
      .meta { text-align: right; }
      ol { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: var(--space-5); }
      li { grid-template-columns: 2.25rem minmax(0, 1fr); }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div><div class="brand">SPECTRA / DAILY RUN</div><h1>今日进展</h1></div>
      <div class="meta"><span class="live" id="live">自动刷新</span><br><span id="updated">读取中…</span></div>
    </header>
    <section class="summary" aria-live="polite">
      <div><div class="status" id="status">正在读取运行状态</div><p class="status-note" id="note">页面每 5 秒自动更新，不会修改后台任务。</p><a class="stage-link" id="stage-link" target="_blank" rel="noopener">查看阶段详情 →</a></div>
      <div class="measure"><strong id="fraction">—</strong><span id="measure-label">总流程进度</span><div class="bar"><i id="bar"></i></div></div>
    </section>
    <aside class="action" id="action" hidden><strong id="action-title"></strong><p id="action-detail"></p></aside>
    <ol id="stages"></ol>
    <details open><summary>逐来源采集健康（正文存在不代表已核验）</summary><div id="source-health" style="overflow-x:auto;margin:16px 0"></div></details>
    <details><summary>定向补搜 · 待核验证据</summary><div id="evidence-search"></div></details>
    <footer><span id="run-id">—</span> · 状态展示与内容生产相互独立；“生成完成”不等于“已发布”。</footer>
  </main>
  <script>
    if (new URLSearchParams(location.search).get('widget') === '1') document.body.classList.add('widget');
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const time = value => value ? new Intl.DateTimeFormat('zh-CN', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit'}).format(new Date(value)) : '暂无更新时间';
    async function refresh() {
      try {
        const response = await fetch('/api/status', {cache:'no-store'});
        if (!response.ok) throw new Error('status unavailable');
        const data = await response.json();
        document.querySelector('#status').textContent = data.label;
        document.title = `${data.label} · SPECTRA`;
        document.querySelector('#updated').textContent = `最后更新 ${time(data.updated_at)}`;
        document.querySelector('#run-id').textContent = data.run_id || '暂无运行';
        const writer = data.writer || {processed:0,total:0,passed:0,demoted:0};
        const percent = Number(data.overall_percent || 0);
        document.querySelector('#fraction').textContent = `${percent}%`;
        document.querySelector('#measure-label').textContent = '总流程进度';
        document.querySelector('#bar').style.width = `${percent}%`;
        const link = document.querySelector('#stage-link');
        link.textContent = `${data.target?.label || '查看阶段详情'} →`;
        link.href = data.target?.url || '/run-artifact/command-progress.json';
        document.querySelector('#note').textContent = writer.total ? `长文通过 ${writer.passed}，转短讯 ${writer.demoted}，转人工 ${writer.manual || 0}。` : '页面每 5 秒自动更新，不会修改后台任务。';
        document.querySelector('#stages').innerHTML = (data.stages || []).map((stage, index) => `<li class="${esc(stage.state)}"><span class="mark">${stage.state === 'done' ? '✓' : index + 1}</span><div><div class="step-name">${esc(stage.name)}</div><div class="step-detail">${esc(stage.detail)}</div></div></li>`).join('');
        document.querySelector('#evidence-search').innerHTML = (data.evidence_search?.jobs || []).map(j => `<p>${esc(j.candidate_id)} · ${esc(j.status)} · ${esc((j.evidence || []).length)} 条来源，尚未核验</p>`).join('') || '暂无补搜任务';
        document.querySelector('#source-health').innerHTML = (data.collection_health || []).length ? '<table style="width:100%;text-align:left;border-spacing:12px"><thead><tr><th>来源</th><th>状态</th><th>条数</th><th>有正文</th><th>仅摘要</th><th>原因</th></tr></thead><tbody>' + data.collection_health.map(s => `<tr><td>${esc(s.source_name || s.registry_id)}</td><td>${esc(s.status)}${s.resumed_from_checkpoint ? ' · 断点恢复' : ''}</td><td>${esc(s.record_count ?? s.accepted ?? '未知')}</td><td>${esc(s.full_text_count ?? '未记录')}</td><td>${esc(s.summary_only_count ?? '未记录')}</td><td>${esc(s.failure_reason || s.error || s.note || '—')}</td></tr>`).join('') + '</tbody></table>' : '尚无来源结果；等待采集器写入断点。';
        const action = document.querySelector('#action');
        action.hidden = !data.action;
        if (data.action) { document.querySelector('#action-title').textContent = data.action.title; document.querySelector('#action-detail').textContent = data.action.detail; }
        document.querySelector('#live').classList.toggle('error', data.reliability === 'failed');
      } catch (error) {
        document.querySelector('#status').textContent = '暂时无法读取进展';
        document.querySelector('#live').textContent = '连接已断开';
        document.querySelector('#live').classList.add('error');
      }
    }
    refresh(); setInterval(refresh, 5000);
  </script>
</body>
</html>
